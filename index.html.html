<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大航海時代：航海家大富翁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #1a120b;
            color: #f3e9dc;
            user-select: none;
        }
        .title-font {
            font-family: 'ZCOOL KuaiLe', cursive;
        }
        .board-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            grid-template-rows: repeat(7, minmax(0, 1fr));
            gap: 3px;
        }
        .parchment {
            background-color: #f4e8c1;
            color: #2c1d0c;
            background-image: radial-gradient(circle, #f4e8c1 0%, #e3ce9e 100%);
            box-shadow: inset 0 0 15px rgba(115, 78, 38, 0.4);
        }
        .wood-panel {
            background-color: #3e2723;
            background-image: linear-gradient(135deg, #4e342e 0%, #271c19 100%);
            border: 4px solid #5d4037;
        }
        .token {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #271c19;
        }
        ::-webkit-scrollbar-thumb {
            background: #8d6e63;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 md:p-4">

    <!-- Header -->
    <header class="w-full max-w-6xl text-center py-2 flex flex-col md:flex-row justify-between items-center border-b border-amber-900/50 mb-2">
        <div class="flex items-center gap-2">
            <span class="text-2xl">⚓</span>
            <h1 class="title-font text-3xl md:text-4xl text-amber-500 tracking-wider drop-shadow-md">大航海時代：航海家大富翁</h1>
        </div>
        <div id="game-status-bar" class="text-sm md:text-base text-amber-200 bg-amber-950/60 px-4 py-1.5 rounded-full border border-amber-800/60 mt-2 md:mt-0 shadow-inner">
            回合: <span id="current-round" class="font-bold text-amber-400">1</span> / 30 | 輪到: <span id="current-player-name" class="font-bold text-amber-300">玩家 1</span>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="w-full max-w-6xl flex-1 grid grid-cols-1 lg:grid-cols-4 gap-4 items-center">
        
        <!-- Left Sidebar: Player Info & Controls -->
        <section class="lg:col-span-1 flex flex-col gap-3 h-full justify-between wood-panel p-4 rounded-xl shadow-2xl">
            <div>
                <h2 class="text-amber-400 font-bold text-lg mb-3 border-b border-amber-900 pb-1 flex items-center justify-between">
                    <span>🏴‍☠️ 航海家艦隊</span>
                    <span class="text-xs text-amber-300/70 font-normal">目標: 5條新航路</span>
                </h2>
                <div id="player-cards-container" class="space-y-3">
                    <!-- Dynamic Player Cards -->
                </div>
            </div>

            <!-- Dice & Action Controls -->
            <div class="mt-4 pt-3 border-t border-amber-900/60 flex flex-col gap-3">
                <div class="flex items-center justify-center gap-4 bg-black/40 p-3 rounded-lg border border-amber-900/30">
                    <div id="dice-1" class="w-12 h-12 bg-amber-100 text-amber-950 rounded-lg flex items-center justify-center text-2xl font-bold shadow-md">🎲</div>
                    <div id="dice-2" class="w-12 h-12 bg-amber-100 text-amber-950 rounded-lg flex items-center justify-center text-2xl font-bold shadow-md">🎲</div>
                </div>
                <button id="roll-btn" onclick="rollDice()" class="w-full bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-amber-950 font-bold py-3 px-4 rounded-lg shadow-lg transition transform active:scale-95 text-lg title-font tracking-wider">
                    升帆啟航 (擲骰子)
                </button>
                <button id="end-turn-btn" onclick="endTurn()" disabled class="w-full bg-stone-700 text-stone-400 font-bold py-2 px-4 rounded-lg shadow cursor-not-allowed transition text-sm">
                    結束回合
                </button>
            </div>
        </section>

        <!-- Center: Game Board -->
        <section class="lg:col-span-2 aspect-square max-w-[620px] w-full mx-auto wood-panel p-3 rounded-2xl shadow-2xl flex items-center justify-center">
            <div id="game-board" class="board-grid w-full h-full rounded-lg overflow-hidden shadow-inner bg-amber-950/40 border border-amber-900/60">
                <!-- Dynamic Tiles generated via JS -->
            </div>
        </section>

        <!-- Right Sidebar: Event Log -->
        <section class="lg:col-span-1 flex flex-col h-full wood-panel p-4 rounded-xl shadow-2xl">
            <h2 class="text-amber-400 font-bold text-lg mb-2 border-b border-amber-900 pb-1 flex items-center gap-2">
                <span>📜</span> 航海日誌與資訊
            </h2>
            <div id="log-container" class="flex-1 bg-black/50 rounded-lg p-3 overflow-y-auto space-y-2 text-xs md:text-sm text-amber-100/90 font-mono border border-amber-900/40 min-h-[220px] max-h-[380px]">
                <div class="text-amber-400/80">[系統] 歡迎來到大航海時代！解鎖航路、建立港口據點、挑戰歷史知識測驗！</div>
            </div>
            
            <div class="mt-3 pt-3 border-t border-amber-900/60">
                <div class="text-xs text-amber-300 font-semibold mb-1">🏆 勝利規則：</div>
                <div class="text-xs text-amber-100/70">先解鎖 5 條新航路者獲勝！或 30 回合內解鎖最多航路者贏得勝利。</div>
            </div>
        </section>

    </main>

    <!-- Modal for Tile Events / Purchases / Quiz -->
    <div id="game-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="parchment max-w-md w-full p-6 rounded-2xl shadow-2xl border-4 border-amber-800 text-center relative transform transition-all scale-95 opacity-0 duration-300" id="modal-content-box">
            <h3 id="modal-title" class="title-font text-2xl text-amber-950 mb-2">事件</h3>
            <div id="modal-body" class="text-sm md:text-base text-amber-900 mb-6 leading-relaxed">
                描述...
            </div>
            <div id="modal-actions" class="flex flex-col gap-2 justify-center">
                <!-- Dynamic Buttons -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full text-center text-xs text-amber-600/70 py-2 mt-2">
        大航海時代：航海家大富翁 &copy; 2026 | 探索、歷史知識、征服
    </footer>

    <!-- Game Logic Script -->
    <script>
        const BOARD_SIZE = 7; // 24 outer perimeter tiles (0 to 23)
        const STARTING_MONEY = 1000;
        const PASS_START_BONUS = 500;
        const TOTAL_ROUNDS = 30;
        const WINNING_ROUTES = 5;

        // Exactly 24 Perimeter Tiles (Index 0..23) matching 7x7 outer border
        const TILES = [
            { id: 0, name: "里斯本 (母港)", type: "start", price: 0, toll: 0, owner: null, color: "bg-amber-700 text-amber-100" },
            { id: 1, name: "直布羅陀", type: "property", price: 300, toll: 40, owner: null, color: "bg-yellow-900 text-amber-100", quizId: "gibraltar" },
            { id: 2, name: "命運海流", type: "chance", price: 0, toll: 0, owner: null, color: "bg-blue-900 text-amber-100" },
            { id: 3, name: "亞速群島", type: "property", price: 350, toll: 50, owner: null, color: "bg-yellow-900 text-amber-100" },
            { id: 4, name: "開普敦航路", type: "explore", price: 400, toll: 0, owner: null, color: "bg-teal-900 text-amber-100", routeName: "好望角突破航路" },
            { id: 5, name: "塞維爾", type: "property", price: 400, toll: 60, owner: null, color: "bg-yellow-900 text-amber-100" },
            { id: 6, name: "熱那亞", type: "property", price: 450, toll: 70, owner: null, color: "bg-amber-800 text-amber-100" },
            
            { id: 7, name: "威尼斯", type: "property", price: 500, toll: 80, owner: null, color: "bg-amber-800 text-amber-100" },
            { id: 8, name: "海盜掠奪", type: "tax", price: 200, toll: 0, owner: null, color: "bg-red-950 text-amber-100" },
            { id: 9, name: "亞歷山大", type: "property", price: 550, toll: 90, owner: null, color: "bg-amber-800 text-amber-100" },
            { id: 10, name: "印度洋航路", type: "explore", price: 500, toll: 0, owner: null, color: "bg-teal-900 text-amber-100", routeName: "西印度洋貿易季風線" },
            { id: 11, name: "莫桑比克", type: "property", price: 600, toll: 100, owner: null, color: "bg-emerald-900 text-amber-100" },
            { id: 12, name: "果阿", type: "property", price: 650, toll: 110, owner: null, color: "bg-emerald-900 text-amber-100", quizId: "goa" },
            
            { id: 13, name: "自由補給港", type: "rest", price: 0, toll: 0, owner: null, color: "bg-cyan-950 text-amber-100" },
            { id: 14, name: "麻六甲", type: "property", price: 750, toll: 130, owner: null, color: "bg-emerald-900 text-amber-100", quizId: "malacca" },
            { id: 15, name: "香料群島航路", type: "explore", price: 600, toll: 0, owner: null, color: "bg-teal-900 text-amber-100", routeName: "香料群島直航線" },
            { id: 16, name: "澳門", type: "property", price: 800, toll: 150, owner: null, color: "bg-purple-900 text-amber-100" },
            { id: 17, name: "海上風暴", type: "tax", price: 250, toll: 0, owner: null, color: "bg-red-950 text-amber-100" },
            { id: 18, name: "長崎", type: "property", price: 850, toll: 160, owner: null, color: "bg-purple-900 text-amber-100", quizId: "nagasaki" },
            
            { id: 19, name: "太平洋環航線", type: "explore", price: 700, toll: 0, owner: null, color: "bg-teal-900 text-amber-100", routeName: "麥哲倫太平洋大環線" },
            { id: 20, name: "黑市貿易", type: "chance", price: 0, toll: 0, owner: null, color: "bg-blue-900 text-amber-100" },
            { id: 21, name: "呂宋", type: "property", price: 900, toll: 170, owner: null, color: "bg-purple-900 text-amber-100" },
            { id: 22, name: "新大陸航路", type: "explore", price: 800, toll: 0, owner: null, color: "bg-teal-900 text-amber-100", routeName: "哥倫布新大陸大航路" },
            { id: 23, name: "哈瓦那", type: "property", price: 950, toll: 180, owner: null, color: "bg-indigo-900 text-amber-100", quizId: "havana" }
        ];

        // Quizzes Data for Quiz Modal
        const QUIZZES = {
            gibraltar: {
                title: "地中海樞紐：直布羅陀",
                story: "直布羅陀海峽是連接地中海與大西洋的唯一海上通道，自古以來就是各大軍事與商業帝國必爭之地。",
                question: "在大航海時代，穿過直布羅陀海峽向西航行，首先會進入哪一片大洋？",
                options: ["印度洋", "大西洋", "太平洋", "北冰洋"],
                answer: 1,
                explanation: "答對了！穿過直布羅陀海峽向西即進入廣袤的大西洋。"
            },
            goa: {
                title: "東方香料帝國：果阿",
                story: "1510年葡萄牙海軍將領阿爾布克爾克佔領果阿，使其成為葡萄牙在印度洋貿易網絡的總部與香料轉運中心。",
                question: "葡萄牙探險家達伽馬開闢繞過好望角到達印度的航線後，主要是為了尋求什麼珍貴商品？",
                options: ["香料與胡椒", "石油與煤炭", "馬匹與鐵器", "橡膠與棉花"],
                answer: 0,
                explanation: "正確！香料（特別是黑胡椒、丁香與肉豆蔻）在當時歐洲價值連城。"
            },
            malacca: {
                title: "遠東十字路口：麻六甲",
                story: "麻六甲掌控著連接印度洋與南中國海的海峽，是東西方香料與絲綢貿易最關鍵的樞紐港口。",
                question: "東西方商船在麻六甲港口等待與航行時，主要依靠什麼自然現象來順利揚帆？",
                options: ["洋流與潮汐", "季風（風向隨季節轉變）", "颱風動力", "海嘯推力"],
                answer: 1,
                explanation: "正確！航海家極度依賴季節性的季風來進行跨洋貿易。"
            },
            nagasaki: {
                title: "極東貿易港：長崎",
                story: "在日本鎖國時期，長崎的出島是日本唯一允許西洋商人（如荷蘭人）進行貿易的指定窗口。",
                question: "大航海時代歐洲商人從日本與美洲大量運出並作為國際貿易通用貨幣的金屬是什麼？",
                options: ["白銀", "青銅", "鋁", "鈦金屬"],
                answer: 0,
                explanation: "正確！日本的石見銀山與美洲白銀大量流入全球貿易網絡。"
            },
            havana: {
                title: "加勒比明珠：哈瓦那",
                story: "哈瓦那是西班牙寶藏艦隊將美洲黃金與白銀運回歐洲前最後匯集的防禦重鎮。",
                question: "西班牙建立的「寶藏艦隊」主要為了防止在加勒比海與大西洋上遭遇何種威脅？",
                options: ["海盜掠奪與敵國私掠船", "海怪攻擊", "極地冰山碰撞", "海底火山爆發"],
                answer: 0,
                explanation: "正確！加勒比海盜與私掠船嚴重威脅著寶藏艦隊的安全。"
            }
        };

        // Players state (1 Human + 2 AIs)
        let players = [
            { id: 0, name: "葡萄牙探險家 (你)", isAI: false, color: "bg-blue-600", border: "border-blue-300", money: STARTING_MONEY, pos: 0, routes: 0, bankrupt: false, icon: "⛵" },
            { id: 1, name: "西班牙無敵艦隊", isAI: true, color: "bg-red-600", border: "border-red-300", money: STARTING_MONEY, pos: 0, routes: 0, bankrupt: false, icon: "🚢" },
            { id: 2, name: "荷蘭東印度公司", isAI: true, color: "bg-emerald-600", border: "border-emerald-300", money: STARTING_MONEY, pos: 0, routes: 0, bankrupt: false, icon: "🛶" }
        ];

        let currentTurnPlayer = 0;
        let currentRound = 1;
        let hasRolled = false;

        function getGridCoordinates(index) {
            if (index <= 6) return { row: 1, col: index + 1 };
            if (index <= 12) return { row: index - 5, col: 7 };
            if (index <= 18) return { row: 7, col: 7 - (index - 12) };
            return { row: 7 - (index - 18), col: 1 };
        }

        function getTileIndexByCoord(r, c) {
            if (r === 1) return c - 1;                     // Top row: 0..6
            if (c === 7 && r > 1 && r < 7) return 5 + r;   // Right col: 7..11
            if (r === 7) return 18 + (7 - c);              // Bottom row: 12..18
            if (c === 1 && r > 1 && r < 7) return 24 - r;  // Left col: 19..23
            return -1;
        }

        function initBoard() {
            const boardContainer = document.getElementById("game-board");
            boardContainer.innerHTML = "";

            for (let r = 1; r <= BOARD_SIZE; r++) {
                for (let c = 1; c <= BOARD_SIZE; c++) {
                    const tileIndex = getTileIndexByCoord(r, c);
                    const cell = document.createElement("div");

                    if (tileIndex !== -1 && tileIndex < TILES.length) {
                        const tile = TILES[tileIndex];
                        cell.id = `tile-${tileIndex}`;
                        cell.className = `relative rounded flex flex-col items-center justify-between p-1 text-center text-[10px] md:text-xs font-semibold overflow-hidden border border-black/30 transition-all ${tile.color} shadow-sm`;
                        
                        let priceText = tile.price > 0 ? `$${tile.price}` : (tile.type === 'tax' ? '損失' : '');
                        if (tile.type === 'explore') priceText = `探索 $${tile.price}`;

                        cell.innerHTML = `
                            <div class="truncate w-full font-bold leading-tight">${tile.name}</div>
                            <div id="tokens-on-${tileIndex}" class="flex flex-wrap gap-0.5 justify-center items-center my-auto"></div>
                            <div class="text-[9px] opacity-90">${priceText}</div>
                        `;
                    } else {
                        // Inner grid
                        cell.className = "bg-amber-950/20 col-span-1 row-span-1 flex items-center justify-center";
                        if (r === 4 && c === 4) {
                            cell.className = "col-span-5 row-span-5 bg-amber-950/80 border-2 border-amber-800/60 rounded-xl p-3 flex flex-col items-center justify-center text-center";
                            cell.innerHTML = `
                                <div class="title-font text-amber-400 text-xl md:text-3xl drop-shadow mb-1">大航海時代</div>
                                <div class="text-amber-200/80 text-xs md:text-sm">解鎖 5 條新航路制霸世界</div>
                            `;
                        } else if (r <= 3 || r >= 5 || c <= 3 || c >= 5) {
                            cell.style.display = "none";
                        }
                    }
                    boardContainer.appendChild(cell);
                }
            }
            updatePlayerCards();
            updateTokens();
        }

        function updatePlayerCards() {
            const container = document.getElementById("player-cards-container");
            container.innerHTML = "";

            players.forEach((p, idx) => {
                const isActive = (idx === currentTurnPlayer && !p.bankrupt);
                const card = document.createElement("div");
                card.className = `p-2.5 rounded-lg border transition-all flex items-center justify-between ${
                    isActive ? 'bg-amber-900/70 border-amber-400 shadow-lg ring-2 ring-amber-400/50' : 'bg-black/40 border-amber-900/40 opacity-80'
                } ${p.bankrupt ? 'grayscale opacity-40' : ''}`;

                card.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-7 h-7 rounded-full ${p.color} flex items-center justify-center text-white text-sm shadow">${p.icon}</span>
                        <div>
                            <div class="font-bold text-amber-200 text-xs md:text-sm flex items-center gap-1">
                                ${p.name} ${isActive ? '<span class="text-xs text-yellow-400 animate-pulse">▶</span>' : ''}
                            </div>
                            <div class="text-[11px] text-amber-400/90 font-mono">$ <span id="player-money-${idx}">${p.money}</span></div>
                        </div>
                    </div>
                    <div class="text-right text-[11px] text-amber-300 font-mono">
                        <div>航路: <span class="text-yellow-400 font-bold">${p.routes}</span>/5</div>
                        <div class="text-[10px] text-amber-200/60">港口: ${getOwnedCount(idx)}</div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById("current-round").innerText = currentRound;
            document.getElementById("current-player-name").innerText = players[currentTurnPlayer].name;
        }

        function getOwnedCount(playerIdx) {
            return TILES.filter(t => t.owner === playerIdx).length;
        }

        function updateTokens() {
            for (let i = 0; i < TILES.length; i++) {
                const tokenContainer = document.getElementById(`tokens-on-${i}`);
                if (tokenContainer) tokenContainer.innerHTML = "";
            }

            players.forEach((p, idx) => {
                if (p.bankrupt) return;
                const tokenContainer = document.getElementById(`tokens-on-${p.pos}`);
                if (tokenContainer) {
                    const badge = document.createElement("span");
                    badge.className = `w-4 h-4 rounded-full ${p.color} border ${p.border} text-[9px] text-white flex items-center justify-center shadow font-bold token`;
                    badge.innerText = idx + 1;
                    tokenContainer.appendChild(badge);
                }
            });
        }

        function logMessage(msg) {
            const logContainer = document.getElementById("log-container");
            const div = document.createElement("div");
            div.className = "border-b border-amber-900/20 pb-1";
            div.innerHTML = `<span class="text-amber-500">[回合 ${currentRound}]</span> ${msg}`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function rollDice() {
            if (hasRolled) return;
            hasRolled = true;
            disableActionButton("roll-btn");

            const d1Val = Math.floor(Math.random() * 6) + 1;
            const d2Val = Math.floor(Math.random() * 6) + 1;
            const totalStep = d1Val + d2Val;

            document.getElementById("dice-1").innerText = d1Val;
            document.getElementById("dice-2").innerText = d2Val;

            logMessage(`${players[currentTurnPlayer].name} 擲出了 🎲 ${d1Val} 與 🎲 ${d2Val} (共 ${totalStep} 步)`);

            movePlayer(currentTurnPlayer, totalStep);
        }

        function movePlayer(playerIdx, steps) {
            let player = players[playerIdx];
            let oldPos = player.pos;
            let newPos = oldPos + steps;

            if (newPos >= TILES.length) {
                newPos %= TILES.length;
                player.money += PASS_START_BONUS;
                logMessage(`🎉 ${player.name} 返回母港里斯本，獲得補給贊助 $${PASS_START_BONUS}！`);
            }

            player.pos = newPos;
            updateTokens();
            updatePlayerCards();

            setTimeout(() => {
                handleTileEvent(playerIdx, newPos);
            }, 350);
        }

        function handleTileEvent(playerIdx, tileIndex) {
            const tile = TILES[tileIndex];
            const player = players[playerIdx];

            if (tile.type === "property") {
                if (tile.owner === null) {
                    if (player.isAI) {
                        if (player.money >= tile.price + 200) {
                            buyProperty(playerIdx, tileIndex, true);
                        } else {
                            logMessage(`${player.name} 資金謹慎，放棄投資 [${tile.name}]。`);
                            finishEventAndNext();
                        }
                    } else {
                        showModal(
                            `發現港口：${tile.name}`,
                            `此港口尚未被佔領。<br>售價：<span class="font-bold text-amber-700">$${tile.price}</span> | 過路費：$${tile.toll}<br><br>是否花費金幣投資此據點？`,
                            [
                                { text: "出資投資", class: "bg-amber-700 hover:bg-amber-600 text-white font-bold py-2 px-4 rounded", action: () => buyProperty(playerIdx, tileIndex, false) },
                                { text: "暫不投資", class: "bg-stone-600 hover:bg-stone-500 text-white font-bold py-2 px-4 rounded", action: () => finishEventAndNext() }
                            ]
                        );
                    }
                } else if (tile.owner === playerIdx) {
                    if (tile.quizId) {
                        promptQuiz(playerIdx, tile.quizId);
                    } else {
                        logMessage(`${player.name} 返回自家港口 [${tile.name}] 休整。`);
                        if (player.isAI) finishEventAndNext();
                        else showModal(`自家港口：${tile.name}`, `艦隊在此順利補給。`, [{ text: "繼續航行", class: "bg-amber-700 text-white py-2 px-4 rounded", action: () => finishEventAndNext() }]);
                    }
                } else {
                    const owner = players[tile.owner];
                    let tollFee = tile.toll;
                    player.money -= tollFee;
                    owner.money += tollFee;

                    logMessage(`⚔️ ${player.name} 停靠在 ${owner.name} 的 [${tile.name}]，支付關稅 $${tollFee}。`);
                    checkBankrupt(playerIdx);
                    updatePlayerCards();

                    if (player.isAI) {
                        finishEventAndNext();
                    } else {
                        showModal(`停靠他國港口：${tile.name}`, `此港口屬於 <span class="font-bold text-amber-800">${owner.name}</span>。<br>支付關稅 <span class="font-bold text-red-700">-$${tollFee}</span>。`, [{ text: "確認支付", class: "bg-red-800 text-white py-2 px-4 rounded", action: () => finishEventAndNext() }]);
                    }
                }
            } else if (tile.type === "explore") {
                if (player.isAI) {
                    if (player.money >= tile.price) {
                        player.money -= tile.price;
                        player.routes += 1;
                        logMessage(`🗺️ ${player.name} 成功開闢了新航路【${tile.routeName}】！（航路: ${player.routes}/5）`);
                        updatePlayerCards();
                        if (player.routes >= WINNING_ROUTES) {
                            declareWinner(player);
                            return;
                        }
                    } else {
                        logMessage(`${player.name} 資金不足，無法開闢【${tile.routeName}】。`);
                    }
                    finishEventAndNext();
                } else {
                    showModal(
                        `未知海域：${tile.name}`,
                        `此處可進行航路探索【<span class="font-bold text-teal-900">${tile.routeName}</span>】！<br>探索費用：<span class="font-bold text-amber-800">$${tile.price}</span><br><br>解鎖新航路是邁向勝利的核心目標！`,
                        [
                            { text: "開始探索", class: "bg-teal-800 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded", action: () => exploreRoute(playerIdx, tileIndex) },
                            { text: "暫不探索", class: "bg-stone-600 hover:bg-stone-500 text-white font-bold py-2 px-4 rounded", action: () => finishEventAndNext() }
                        ]
                    );
                }
            } else if (tile.type === "chance") {
                triggerChanceCard(playerIdx);
            } else if (tile.type === "tax") {
                player.money -= tile.price;
                logMessage(`💥 ${player.name} 遭遇 ${tile.name}，損失資金 $${tile.price}！`);
                checkBankrupt(playerIdx);
                updatePlayerCards();

                if (player.isAI) finishEventAndNext();
                else showModal(`海上災害：${tile.name}`, `遭遇風暴或海盜侵襲，損失資金 <span class="font-bold text-red-700">-$${tile.price}</span>。`, [{ text: "承受損失", class: "bg-stone-700 text-white py-2 px-4 rounded", action: () => finishEventAndNext() }]);
            } else {
                logMessage(`⚓ ${player.name} 停留在 ${tile.name}，平安無事。`);
                if (player.isAI) finishEventAndNext();
                else showModal(`安全海域：${tile.name}`, `艦隊在此順利補給。`, [{ text: "好的", class: "bg-amber-700 text-white py-2 px-4 rounded", action: () => finishEventAndNext() }]);
            }
        }

        function buyProperty(playerIdx, tileIndex, autoNext) {
            const tile = TILES[tileIndex];
            const player = players[playerIdx];

            if (player.money >= tile.price) {
                player.money -= tile.price;
                tile.owner = playerIdx;

                const tileElement = document.getElementById(`tile-${tileIndex}`);
                if (tileElement) {
                    tileElement.style.border = `2px solid ${getPlayerColorHex(playerIdx)}`;
                }

                updatePlayerCards();
                logMessage(`👑 ${player.name} 成功投資港口 [${tile.name}]！`);

                if (tile.quizId && !player.isAI) {
                    promptQuiz(playerIdx, tile.quizId);
                } else {
                    if (autoNext) finishEventAndNext();
                    else closeModalAndProceed();
                }
            } else {
                if (!player.isAI) alert("金幣不足，無法購買此港口！");
                finishEventAndNext();
            }
        }

        function exploreRoute(playerIdx, tileIndex) {
            const tile = TILES[tileIndex];
            const player = players[playerIdx];

            if (player.money >= tile.price) {
                player.money -= tile.price;
                player.routes += 1;
                updatePlayerCards();
                logMessage(`🗺️ ${player.name} 成功解鎖了新航路【${tile.routeName}】！（目前航路: ${player.routes}/5）`);

                if (player.routes >= WINNING_ROUTES) {
                    declareWinner(player);
                } else {
                    closeModalAndProceed();
                }
            } else {
                alert("金幣不足，無法進行航路探索！");
                closeModalAndProceed();
            }
        }

        function promptQuiz(playerIdx, quizKey) {
            const quiz = QUIZZES[quizKey];
            const player = players[playerIdx];

            if (player.isAI) {
                // AI auto answer with 75% accuracy
                const correct = Math.random() < 0.75;
                if (correct) {
                    player.money += 200;
                    logMessage(`🧠 ${player.name} 完成了 [${quiz.title}] 的歷史問答，獲得獎金 $200！`);
                } else {
                    logMessage(`🧠 ${player.name} 在 [${quiz.title}] 歷史問答中答錯了。`);
                }
                updatePlayerCards();
                finishEventAndNext();
                return;
            }

            // Human player interactive quiz modal
            let optionsHtml = quiz.options.map((opt, idx) => `
                <button onclick="answerQuiz(${playerIdx}, ${idx}, ${quiz.answer}, '${quizKey}')" class="w-full text-left bg-amber-950/20 hover:bg-amber-800 hover:text-white border border-amber-900/60 p-2.5 rounded-lg transition text-amber-950 text-xs md:text-sm font-semibold my-1">
                    ${idx + 1}. ${opt}
                </button>
            `).join('');

            showModal(
                `📜 歷史知識小測驗：${quiz.title}`,
                `<div class="text-left text-xs md:text-sm bg-amber-900/10 p-3 rounded-lg border border-amber-800/20 mb-3">${quiz.story}</div>
                 <div class="font-bold text-amber-950 text-left mb-2">${quiz.question}</div>
                 <div class="flex flex-col gap-1">${optionsHtml}</div>`,
                []
            );
        }

        function answerQuiz(playerIdx, selected, correct, quizKey) {
            const player = players[playerIdx];
            const quiz = QUIZZES[quizKey];

            if (selected === correct) {
                player.money += 200;
                updatePlayerCards();
                logMessage(`🎯 你答對了 [${quiz.title}] 歷史測驗！獲得知識獎勵 $200！`);
                showModal(
                    `🎉 答對了！`,
                    `<div class="text-green-800 font-bold mb-2">獎勵 $200 已加入資產！</div><div class="text-xs text-amber-900">${quiz.explanation}</div>`,
                    [{ text: "太棒了", class: "bg-amber-700 text-white font-bold py-2 px-4 rounded", action: () => closeModalAndProceed() }]
                );
            } else {
                logMessage(`❌ 你回答了 [${quiz.title}] 歷史測驗，可惜答錯了。`);
                showModal(
                    `😅 差一點點！`,
                    `<div class="text-red-800 font-bold mb-2">正確答案是：${quiz.options[correct]}</div><div class="text-xs text-amber-900">${quiz.explanation}</div>`,
                    [{ text: "吸取教訓", class: "bg-stone-700 text-white font-bold py-2 px-4 rounded", action: () => closeModalAndProceed() }]
                );
            }
        }

        function triggerChanceCard(playerIdx) {
            const player = players[playerIdx];
            const events = [
                { title: "發現順風季風", desc: "獲得順風助航，獲得皇家特別貿易補助 <span class='text-green-700 font-bold'>+$300</span>", action: () => { player.money += 300; } },
                { title: "皇室特許令", desc: "獲得國王親頒榮譽，賜予獎金 <span class='text-green-700 font-bold'>+$400</span>", action: () => { player.money += 400; } },
                { title: "走私客侵擾", desc: "港口倉庫遭走私客偷襲，損失物資 <span class='text-red-700 font-bold'>-$250</span>", action: () => { player.money -= 250; } },
                { title: "船底大修", desc: "旗艦觸礁受損，進入造船廠大修 <span class='text-red-700 font-bold'>-$300</span>", action: () => { player.money -= 300; } }
            ];

            const ev = events[Math.floor(Math.random() * events.length)];
            ev.action();
            checkBankrupt(playerIdx);
            updatePlayerCards();
            logMessage(`📜 命運事件 [${ev.title}] 降臨在 ${player.name} 身上。`);

            if (player.isAI) {
                finishEventAndNext();
            } else {
                showModal(`命運海流：${ev.title}`, ev.desc, [{ text: "接受命運", class: "bg-blue-900 text-white py-2 px-4 rounded", action: () => finishEventAndNext() }]);
            }
        }

        function checkBankrupt(playerIdx) {
            const player = players[playerIdx];
            if (player.money < 0) player.money = 0;
        }

        function getPlayerColorHex(playerIdx) {
            switch(playerIdx) {
                case 0: return '#2563eb';
                case 1: return '#dc2626';
                case 2: return '#059669';
                default: return '#ffffff';
            }
        }

        function showModal(title, bodyHtml, actions) {
            const modal = document.getElementById("game-modal");
            const box = document.getElementById("modal-content-box");
            document.getElementById("modal-title").innerText = title;
            document.getElementById("modal-body").innerHTML = bodyHtml;
            
            const actionsContainer = document.getElementById("modal-actions");
            actionsContainer.innerHTML = "";
            actions.forEach(act => {
                const btn = document.createElement("button");
                btn.className = act.class;
                btn.innerText = act.text;
                btn.onclick = act.action;
                actionsContainer.appendChild(btn);
            });

            modal.classList.remove("hidden");
            setTimeout(() => {
                box.classList.remove("scale-95", "opacity-0");
                box.classList.add("scale-100", "opacity-100");
            }, 10);
        }

        function closeModalAndProceed() {
            const modal = document.getElementById("game-modal");
            const box = document.getElementById("modal-content-box");
            box.classList.remove("scale-100", "opacity-100");
            box.classList.add("scale-95", "opacity-0");
            setTimeout(() => {
                modal.classList.add("hidden");
                finishEventAndNext();
            }, 200);
        }

        function finishEventAndNext() {
            const player = players[currentTurnPlayer];
            if (player.isAI) {
                setTimeout(() => {
                    endTurn();
                }, 800);
            } else {
                enableActionButton("end-turn-btn");
            }
        }

        function endTurn() {
            disableActionButton("end-turn-btn");

            currentTurnPlayer = (currentTurnPlayer + 1) % players.length;
            if (currentTurnPlayer === 0) {
                currentRound++;
                if (currentRound > TOTAL_ROUNDS) {
                    declareWinner();
                    return;
                }
            }

            hasRolled = false;
            updatePlayerCards();
            logMessage(`▶ 輪到 ${players[currentTurnPlayer].name} 的回合。`);

            if (players[currentTurnPlayer].isAI) {
                disableActionButton("roll-btn");
                setTimeout(() => {
                    rollDice();
                }, 1000);
            } else {
                enableActionButton("roll-btn");
            }
        }

        function disableActionButton(btnId) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            btn.disabled = true;
            btn.classList.add("opacity-50", "cursor-not-allowed");
            if (btnId === "end-turn-btn") {
                btn.className = "w-full bg-stone-700 text-stone-400 font-bold py-2 px-4 rounded-lg shadow cursor-not-allowed transition text-sm";
            }
        }

        function enableActionButton(btnId) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            btn.disabled = false;
            btn.classList.remove("opacity-50", "cursor-not-allowed");
            if (btnId === "end-turn-btn") {
                btn.className = "w-full bg-gradient-to-r from-amber-700 to-amber-800 hover:from-amber-600 hover:to-amber-700 text-amber-100 font-bold py-2 px-4 rounded-lg shadow transition cursor-pointer text-sm";
            }
        }

        function declareWinner(winner) {
            if (!winner) {
                let maxRoutes = -1;
                let maxAsset = -1;
                players.forEach(p => {
                    let totalAsset = p.money + (p.routes * 500);
                    if (p.routes > maxRoutes || (p.routes === maxRoutes && totalAsset > maxAsset)) {
                        maxRoutes = p.routes;
                        maxAsset = totalAsset;
                        winner = p;
                    }
                });
            }

            showModal(
                `🏆 航海霸主誕生！`,
                `遊戲結束！恭喜 <span class="text-amber-800 font-bold text-lg">${winner.name}</span> 成功發現最多航路（${winner.routes} 條）並制霸全球貿易，成為大航海時代的傳奇霸主！`,
                [{ text: "重新啟航", class: "bg-amber-800 hover:bg-amber-700 text-white font-bold py-2 px-6 rounded-lg", action: () => location.reload() }]
            );
        }

        window.onload = () => {
            initBoard();
            disableActionButton("end-turn-btn");
        };
    </script>
</body>
</html>
